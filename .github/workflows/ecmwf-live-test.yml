name: ECMWF + GEFS Live Prototype Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'run_v2.py'
      - 'run_v3.py'
      - 'requirements.txt'
      - '.github/workflows/ecmwf-live-test.yml'

jobs:
  live-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install ecCodes system runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes0 libeccodes-dev
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Run live ECMWF + NOAA GEFS comparison for Tangier +72h
        run: |
          mkdir -p output data
          python run_v3.py --city tangier --step 72 --rain-threshold 1 | tee output/forecast_compare_tangier_072h.json
      - name: Verify generated products
        run: |
          test -s output/forecast_compare_tangier_072h.json
          test -s output/precip_072h.png
          test -s output/pressure_wind_072h.png
          test -s output/upper_500_072h.png
          test -s output/upper_850_072h.png
          python - <<'PY'
          import json
          from pathlib import Path
          text = Path('output/forecast_compare_tangier_072h.json').read_text(encoding='utf-8')
          payload = json.loads(text[text.find('{'):])
          assert payload['city'] == 'tangier'
          assert payload['ecmwf']['model'] == 'ECMWF IFS'
          assert payload['gefs']['model'] == 'NOAA GEFS control'
          assert payload['forecast_step_hours'] == 72
          assert 'score_percent' in payload['model_agreement']
          assert set(['precipitation','pressure_wind','500hpa','850hpa']).issubset(payload['maps'])
          print('Validated ECMWF + GEFS:', payload['model_agreement'])
          PY
      - name: Validate API and short timeline
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.api.main import app
          c = TestClient(app)
          h = c.get('/health')
          assert h.status_code == 200
          assert h.json()['horizon_days'] == 15
          ui = c.get('/mobile-ui/')
          assert ui.status_code == 200
          assert 'طقس المغرب' in ui.text
          assert 'ثقة النماذج' in ui.text
          assert 'اتجاه 8–15 يومًا' in ui.text
          assert 'المناطق المتأثرة' in ui.text
          assert 'خرائط الطقس' in ui.text
          assert 'توقع 15 يومًا' in ui.text
          assert 'الإعدادات' in ui.text
          assert 'data-page="forecast15"' in ui.text
          assert 'data-page="maps"' in ui.text
          assert 'data-page="modelAnalysis"' in ui.text
          assert 'data-page="settings"' in ui.text
          m = c.get('/meta')
          assert m.status_code == 200
          assert 360 in m.json()['timeline_steps_hours']
          t = c.get('/timeline/tangier?start=72&end=72&include_gefs=true')
          assert t.status_code == 200, t.text
          p = t.json()
          assert len(p['timeline']) == 1
          assert p['timeline'][0]['step_hours'] == 72
          assert 'agreement' in p['timeline'][0]
          # Regression: a range with no scheduled step must return an empty timeline,
          # never fall back to downloading the full 15-day schedule.
          empty = c.get('/timeline/tangier?start=145&end=155&include_gefs=false')
          assert empty.status_code == 200, empty.text
          assert empty.json()['timeline'] == []
          mobile = c.get('/mobile/tangier?step=72&rain_threshold=1&include_gefs=true&gefs_members=3&include_daily=true')
          assert mobile.status_code == 200, mobile.text
          mp = mobile.json()
          assert mp['meta']['api_version'] == '0.10.0'
          assert mp['current']['model'] == 'ECMWF IFS'
          assert mp['timeline'][0]['gefs']['model'] == 'NOAA GEFS control'
          assert mp['cross_model_agreement']['official_probability'] is False
          assert 'gefs_ensemble' in mp
          ge = mp['gefs_ensemble']
          assert ge['official_probability'] is False
          assert ge['source'] == 'NOAA/NCEP GEFS perturbed members'
          if ge['available_member_count']:
              assert ge['available_member_count'] >= 2
              assert ge['requested_member_count'] == 3
              assert ge['temperature_c']['mean'] is not None
              assert ge['temperature_c']['spread'] >= 0
          assert 'ensemble_uncertainty' in mp
          uncertainty = mp['ensemble_uncertainty']
          assert uncertainty['official_probability'] is False
          assert uncertainty['source_mean'] == 'ECMWF ENS type=em'
          assert uncertainty['source_spread'] == 'ECMWF ENS type=es'
          if uncertainty['ecmwf_ens_pressure_spread_hpa'] is not None:
              assert uncertainty['ecmwf_ens_pressure_spread_hpa'] >= 0
              assert uncertainty['uncertainty_label_ar'] in ['منخفض', 'متوسط', 'مرتفع']
          assert 'official_probabilities' in mp
          official = mp['official_probabilities']['ecmwf_ens_precipitation']
          if official is not None:
              assert official['official_probability'] is True
              assert official['source'] == 'ECMWF ENS type=ep'
          assert set(['precipitation','pressure_wind','500hpa','850hpa']).issubset(mp['maps']['available_layers'])
          layer_meta = {x['id']: x for x in mp['maps']['layers']}
          assert all(layer_meta[x]['available'] for x in ['precipitation','pressure_wind','500hpa','850hpa'])
          assert layer_meta['precipitation']['url'] == '/maps/precip_072h.png'
          map_response = c.get(layer_meta['precipitation']['url'])
          assert map_response.status_code == 200
          assert map_response.headers['content-type'].startswith('image/png')
          assert len(map_response.content) > 0
          assert mp['analysis_ar']
          assert 'analysis' in mp
          assert mp['analysis']['warning'] is False
          assert 'warning_note_ar' in mp['analysis']
          assert isinstance(mp['affected_cities'], list)
          for city_impact in mp['affected_cities']:
              assert city_impact['city'] in ['tangier','tetouan','chefchaouen','rabat','casablanca','fes','marrakesh']
              assert city_impact['impact_score'] >= 1
              assert city_impact['reasons_ar']
          assert len(mp['day_cards']) == 3
          assert mp['day_cards'][-1]['end_step_hours'] == 72
          assert 'daily_precip_mm' in mp['day_cards'][-1]
          assert mp['extended_trend_8_15_days']['deterministic'] is False
          assert mp['extended_trend_8_15_days']['official_probability'] is False
          print('Validated mobile API contract and probability semantics')
          from app.forecast.daily import daily_from_accumulated, extended_probabilistic_trend
          sample = [
              {'step_hours': 24, 'ecmwf': {'temperature_c': 10, 'wind_kmh': 20, 'total_precip_mm': 3}},
              {'step_hours': 48, 'ecmwf': {'temperature_c': 12, 'wind_kmh': 30, 'total_precip_mm': 8}},
          ]
          cards = daily_from_accumulated(sample)
          assert cards[0]['daily_precip_mm'] == 3.0
          assert cards[1]['daily_precip_mm'] == 5.0
          trend = extended_probabilistic_trend([
              {'day': 8, 'temperature_c': {'mean': 15, 'spread': 2}, 'total_precip_mm': {'mean': 10}},
              {'day': 10, 'temperature_c': {'mean': 17, 'spread': 4}, 'total_precip_mm': {'mean': 14}},
          ])
          assert trend['deterministic'] is False
          assert trend['official_probability'] is False
          assert trend['temperature_mean_c'] == 16.0
          assert trend['temperature_mean_spread_c'] == 3.0
          print('Validated daily accumulation semantics and days 8-15 probabilistic trend contract')
          PY
      - name: Upload forecast artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morocco-weather-engine-v3
          path: |
            output/*.json
            output/*.png
          if-no-files-found: warn
          retention-days: 7
