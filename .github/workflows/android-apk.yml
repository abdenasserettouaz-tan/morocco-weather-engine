name: Android APK Build
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate HTTPS endpoint configuration
        env:
          WEATHER_APP_URL: ${{ vars.WEATHER_APP_URL }}
        run: |
          if [ -z "$WEATHER_APP_URL" ]; then WEATHER_APP_URL="https://weather.example.invalid/mobile-ui/"; fi
          case "$WEATHER_APP_URL" in https://*) ;; *) echo "WEATHER_APP_URL must use HTTPS"; exit 1;; esac
          echo "WEATHER_APP_URL=$WEATHER_APP_URL" >> "$GITHUB_ENV"
      - name: Build debug APK
        run: gradle :app:assembleDebug -PweatherAppUrl="$WEATHER_APP_URL"
      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          apksigner verify app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: morocco-weather-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
